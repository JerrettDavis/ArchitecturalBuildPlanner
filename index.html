<!DOCTYPE html><html><head><meta charset="UTF-8"><title>ArchitecturalBuildPlanner</title><link rel="stylesheet" href="styles.css"></head><body><div class="app"><aside class="sidebar"><h1>Build Planner</h1><div class="group"><label>Wall Height (ft)</label><input id="wallHeight" type="number" value="8" step="0.5"><label>Stud Spacing</label><select id="spacingPreset"><option value="12">12 in</option><option value="16" selected>16 in</option><option value="24">24 in</option></select><label>Wall Thickness (ft)</label><input id="wallThickness" type="number" value="0.5" step="0.125"></div><div class="toolbar"><button id="addWall">Add Wall</button><button id="generate">Generate</button></div><div id="wallsEditor" class="walls-editor"></div><pre id="output"></pre></aside><main class="main"><section class="panel wide"><div class="panel-title">3D Assembly</div><canvas id="three"></canvas></section><section class="panel"><div class="panel-title">2D Floorplan</div><svg id="plan" viewBox="0 0 900 600"></svg></section></main></div><script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script><script src="https://unpkg.com/three@0.160.0/examples/js/controls/OrbitControls.js"></script><script src="app.js"></script></body></html>
